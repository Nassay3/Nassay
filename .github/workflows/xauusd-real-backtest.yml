name: XAUUSD Real Backtest

on:
  push:
    branches: [research/xauusd-real-backtest-20260909]
    paths:
      - research/xauusd_real_grid.py
      - .github/workflows/xauusd-real-backtest.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip pandas numpy
      - name: Download real MT5 XAUUSD M15 2010-2026
        run: |
          mkdir -p data
          curl -fL --retry 5 --retry-delay 2 \
            'https://raw.githubusercontent.com/simom1/XAUUSD-history/main/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv' \
            -o data/XAUUSD_M15.csv
          ls -lh data/XAUUSD_M15.csv
          head -n 3 data/XAUUSD_M15.csv
          tail -n 3 data/XAUUSD_M15.csv
      - name: Run grid
        run: python research/xauusd_real_grid.py --data data/XAUUSD_M15.csv --out xau_results
      - name: Show result
        if: always()
        run: |
          test -f xau_results/summary.json && cat xau_results/summary.json || true
          test -f xau_results/stage2.csv && head -n 10 xau_results/stage2.csv || true
      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-real-backtest-results
          path: xau_results/
          if-no-files-found: warn
          retention-days: 30
