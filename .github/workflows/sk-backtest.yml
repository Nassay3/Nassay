name: SK Multi-Timeframe Backtest

on:
  push:
    branches: [sk-backtest-2026-07-28]
    paths:
      - '.github/workflows/sk-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==18.1.0 requests==2.32.3 matplotlib==3.9.3
      - name: Restore backtest engine
        shell: bash
        run: |
          mkdir -p research/sk_backtest
          cat > /tmp/sk_backtest.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/sk_backtest.py.gz.b64 | gzip -d > research/sk_backtest/backtest.py
      - name: Run backtest
        run: python research/sk_backtest/backtest.py
      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: sk-backtest-results
          path: research/sk_backtest/output/
          if-no-files-found: error
          retention-days: 30
