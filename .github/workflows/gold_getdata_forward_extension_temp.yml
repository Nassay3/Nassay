name: Gold GetData Forward Extension Temp

on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_getdata_forward_extension.py'
      - '.github/workflows/gold_getdata_forward_extension_temp.yml'
  workflow_dispatch:

jobs:
  forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Download GetData sample
        run: curl -L --fail --retry 3 'https://getdata.finance/samples/XAUUSD.csv' -o /tmp/XAUUSD.csv
      - name: Run frozen forward extension
        run: python research/gold_getdata_forward_extension.py
