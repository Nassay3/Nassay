name: Gold Signal Quality Dukascopy Fast Temp

on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_signal_quality_dukascopy_fast.py'
      - '.github/workflows/gold_signal_quality_dukascopy_fast_temp.yml'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - name: Run single-pass Dukascopy stress validation
        run: python research/gold_signal_quality_dukascopy_fast.py
