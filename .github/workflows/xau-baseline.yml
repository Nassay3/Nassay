name: XAU Baseline
on:
  push:
    branches: [research/xau-baseline-public-20260908]
    paths:
      - 'research/xau_baseline/**'
      - '.github/workflows/xau-baseline.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pandas numpy requests
      - run: cd research/xau_baseline && pytest -q
