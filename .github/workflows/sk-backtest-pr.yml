name: SK Backtest PR Runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==18.1.0 requests==2.32.3 matplotlib==3.9.3
      - name: Extract backtest engine from primary workflow
        shell: bash
        run: |
          mkdir -p research/sk_backtest
          sed -n "/^H4sI/,/^PAYLOAD$/p" .github/workflows/sk-backtest.yml | sed '$d' > /tmp/sk_backtest.py.gz.b64
          base64 -d /tmp/sk_backtest.py.gz.b64 | gzip -d > research/sk_backtest/backtest.py
          python -m py_compile research/sk_backtest/backtest.py
      - name: Run backtest
        run: python research/sk_backtest/backtest.py
      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: sk-backtest-results
          path: research/sk_backtest/output/
          if-no-files-found: error
          retention-days: 30
