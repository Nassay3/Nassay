name: SK Backtest PR Runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==18.1.0 requests==2.32.3 matplotlib==3.9.3 tabulate==0.9.0
      - name: Extract and patch backtest engine
        shell: bash
        run: |
          mkdir -p research/sk_backtest
          sed -n "/^H4sI/,/^PAYLOAD$/p" .github/workflows/sk-backtest.yml | sed '$d' > /tmp/sk_backtest.py.gz.b64
          base64 -d /tmp/sk_backtest.py.gz.b64 | gzip -d > research/sk_backtest/backtest.py
          python - <<'PY'
          from pathlib import Path
          p = Path('research/sk_backtest/backtest.py')
          s = p.read_text()
          old = 'df["time"] = pd.to_datetime(ot, unit=unit, utc=True)'
          new = 'ot_ms = np.where(ot > 1e14, ot / 1000.0, ot)\n    df["time"] = pd.to_datetime(ot_ms, unit="ms", utc=True)'
          if old not in s:
              raise SystemExit('timestamp conversion target not found')
          p.write_text(s.replace(old, new))
          PY
          python -m py_compile research/sk_backtest/backtest.py
      - name: Run backtest
        run: python research/sk_backtest/backtest.py
      - name: Collect generated reports
        shell: bash
        run: |
          mkdir -p artifact
          find . -type f \( -name '*.csv' -o -name '*.parquet' -o -name '*.json' -o -name '*.md' -o -name '*.png' \) \
            ! -path './.git/*' ! -path './node_modules/*' ! -path './data/*' \
            -exec cp --parents '{}' artifact/ \;
          echo 'Collected files:'
          find artifact -type f -maxdepth 8 -print
      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: sk-backtest-results
          path: artifact/
          if-no-files-found: error
          retention-days: 30
