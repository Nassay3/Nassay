name: Gold Champion BLS Blackout Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_champion_bls_blackout.py'
      - '.github/workflows/gold_champion_bls_blackout_temp.yml'
  workflow_dispatch:
jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba beautifulsoup4
      - name: Sparse clone XAU M1 files only
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/simom1/XAUUSD-history.git /tmp/xau
          git -C /tmp/xau sparse-checkout init --no-cone
          git -C /tmp/xau sparse-checkout set --no-cone 'Gold-Cash/XAUUSD/XAUUSD_M1_2020_2022.csv' 'Gold-Cash/XAUUSD/XAUUSD_M1_2023_2026.csv'
          git -C /tmp/xau checkout main
      - name: Download official BLS yearly calendars
        run: |
          for y in 2021 2022 2023 2024 2025 2026; do
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "https://www.bls.gov/schedule/$y/" -o "/tmp/bls_$y.html"
          done
      - name: Run champion news blackout
        run: python research/gold_champion_bls_blackout.py
