name: Gold M5 VWAP Consensus Ablation Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_m5_vwap_consensus_ablation.py'
      - '.github/workflows/gold_m5_vwap_consensus_ablation_temp.yml'
  workflow_dispatch:
jobs:
  consensus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - name: Sparse clone XAU M1 files only
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/simom1/XAUUSD-history.git /tmp/xau
          git -C /tmp/xau sparse-checkout init --no-cone
          git -C /tmp/xau sparse-checkout set --no-cone 'Gold-Cash/XAUUSD/XAUUSD_M1_2020_2022.csv' 'Gold-Cash/XAUUSD/XAUUSD_M1_2023_2026.csv'
          git -C /tmp/xau checkout main
      - name: Run consensus ablation
        run: python research/gold_m5_vwap_consensus_ablation.py
