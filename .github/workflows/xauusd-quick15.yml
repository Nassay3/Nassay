name: XAUUSD Quick 15m
on:
  push:
    branches: [research/xauusd-real-backtest-20260909]
    paths:
      - research/xauusd_quick15.py
      - .github/workflows/xauusd-quick15.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Download XAUUSD M15
        run: |
          mkdir -p data
          curl -fL --retry 5 'https://raw.githubusercontent.com/simom1/XAUUSD-history/main/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv' -o data/XAUUSD_M15.csv
      - name: Run quick 15m grid
        run: python research/xauusd_quick15.py --data data/XAUUSD_M15.csv --out xau_quick
      - name: Show summary
        if: always()
        run: test -f xau_quick/summary.json && cat xau_quick/summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd-quick15-results
          path: xau_quick/
          if-no-files-found: warn
          retention-days: 30
