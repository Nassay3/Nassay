name: Gold CME True Orderflow Test Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_cme_true_orderflow_features.py'
      - 'research/test_gold_cme_true_orderflow_features.py'
      - '.github/workflows/gold_cme_true_orderflow_test_temp.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - run: python research/test_gold_cme_true_orderflow_features.py
