name: Gold M5 Git Quick Temp

on:
  push:
    branches:
      - gold-backtest-temp-20260908
    paths:
      - 'research/gold_m5_gitquick.py'
      - '.github/workflows/gold_m5_gitquick_temp.yml'

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Clone XAU data repository
        run: git clone --depth 1 https://github.com/simom1/XAUUSD-history.git /tmp/xau
      - name: Run Git-local M5 spike
        run: python research/gold_m5_gitquick.py
