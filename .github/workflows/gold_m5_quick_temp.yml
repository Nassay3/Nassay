name: Gold M5 Quick Temp

on:
  push:
    branches:
      - gold-backtest-temp-20260908
    paths:
      - 'research/gold_m5_quick_spike.py'
      - '.github/workflows/gold_m5_quick_temp.yml'

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run quick M5 spike
        run: python research/gold_m5_quick_spike.py
