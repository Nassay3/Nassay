name: Gold Research Backtest Temp

on:
  push:
    branches:
      - gold-backtest-temp-20260908
    paths:
      - 'research/gold_m5_discovery_spike.py'
      - '.github/workflows/gold_backtest_temp.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run five-year M5 gold discovery spike
        run: python research/gold_m5_discovery_spike.py
