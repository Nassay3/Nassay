name: Gold Dukascopy Microfeatures Test Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/test_gold_duka_microfeatures.py'
      - 'research/gold_duka_microfeatures.py'
      - '.github/workflows/gold_duka_microfeatures_test_temp.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run causality tests
        run: PYTHONPATH=research python research/test_gold_duka_microfeatures.py
