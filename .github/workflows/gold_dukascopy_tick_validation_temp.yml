name: Gold Dukascopy Tick Validation Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_dukascopy_tick_validation.py'
      - '.github/workflows/gold_dukascopy_tick_validation_temp.yml'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - name: Run Dukascopy quote-tick validation
        run: python research/gold_dukascopy_tick_validation.py
