name: Gold Quality Dukascopy BidAsk Corrected Temp

on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_quality_duka_bidask_corrected.py'
      - '.github/workflows/gold_quality_duka_bidask_corrected_temp.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - name: Sparse clone signal-source M1 history
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/simom1/XAUUSD-history.git /tmp/xau
          git -C /tmp/xau sparse-checkout init --no-cone
          git -C /tmp/xau sparse-checkout set --no-cone 'Gold-Cash/XAUUSD/XAUUSD_M1_2020_2022.csv' 'Gold-Cash/XAUUSD/XAUUSD_M1_2023_2026.csv'
          git -C /tmp/xau checkout main
      - name: Fetch Dukascopy M1 BID ASK monthly files 2021-08 through 2026-06
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/kevingtlin/dukascopy_XAUUSD_1m_Data.git /tmp/dukasrc
          mkdir -p /tmp/dukam1/ask /tmp/dukam1/bid
          for y in 2021 2022 2023 2024 2025 2026; do
            sm=01; em=12
            if [ "$y" = "2021" ]; then sm=08; fi
            if [ "$y" = "2026" ]; then em=06; fi
            for m in $(seq -w $sm $em); do
              for side in ask bid; do
                f="xauusd_${side}_m1_${y}_${m}.csv"
                p="xauusd/${side}/m1/${f}"
                git -C /tmp/dukasrc show "HEAD:${p}" > "/tmp/dukam1/${side}/${f}"
                test -s "/tmp/dukam1/${side}/${f}"
              done
            done
          done
          du -sh /tmp/dukam1
      - name: Normalize Pandas timestamp units in shared execution loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/gold_duka_m1_bidask_multiyear.py')
          s=p.read_text()
          s=s.replace("dtime=(dec.index+pd.Timedelta(minutes=5)).asi8", "dtime=pd.DatetimeIndex(dec.index+pd.Timedelta(minutes=5)).as_unit('ns').asi8")
          s=s.replace("times=q.time.array.asi8", "times=pd.DatetimeIndex(q.time).as_unit('ns').asi8")
          p.write_text(s)
          PY
      - name: Run corrected cross-feed execution validation
        run: python research/gold_quality_duka_bidask_corrected.py
