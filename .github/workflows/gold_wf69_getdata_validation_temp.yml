name: Gold WF69 GetData Validation Temp
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_wf69_getdata_validation.py'
      - '.github/workflows/gold_wf69_getdata_validation_temp.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - run: curl -L --fail --retry 3 'https://getdata.finance/samples/XAUUSD.csv' -o /tmp/XAUUSD.csv
      - run: python research/gold_wf69_getdata_validation.py
