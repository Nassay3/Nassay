name: Gold Champion Diagnostics Temp

# rerun 2026-09-08 after exact-equity external validation
on:
  push:
    branches: [gold-backtest-temp-20260908]
    paths:
      - 'research/gold_champion_diagnostics.py'
      - '.github/workflows/gold_champion_diagnostics_temp.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy numba
      - name: Sparse clone XAU M1 files only
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/simom1/XAUUSD-history.git /tmp/xau
          git -C /tmp/xau sparse-checkout init --no-cone
          git -C /tmp/xau sparse-checkout set --no-cone 'Gold-Cash/XAUUSD/XAUUSD_M1_2020_2022.csv' 'Gold-Cash/XAUUSD/XAUUSD_M1_2023_2026.csv'
          git -C /tmp/xau checkout main
      - name: Download independent GetData sample
        run: curl -L --fail --retry 3 'https://getdata.finance/samples/XAUUSD.csv' -o /tmp/XAUUSD.csv
      - name: Run diagnostics
        run: python research/gold_champion_diagnostics.py
